# Default logging for every service — caps each container's JSON log file
# at 50 MB and keeps 3 rotations (~150 MB ceiling per service). Without
# this Docker's json-file driver writes to /var/lib/docker/containers/<id>/*-json.log
# without bound, so a noisy week of traffic can fill the disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ── Edge proxy: nginx ────────────────────────────────────────────────────
  # Sits behind Cloudflare. TLS terminates here using a Cloudflare Origin
  # Certificate (preferred — pair with CF "Full (strict)") or the self-signed
  # cert generated by deploy.sh as a bootstrap (works with CF "Full" only).
  # Routing rules + tunables live in proxy/nginx/nginx.conf — single source.
  # See proxy/nginx/README.md for cert workflow + troubleshooting.
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A single-FILE bind mount binds the inode, not the path, and `git pull`
      # replaces this file rather than editing it — so a running proxy keeps
      # serving the config it booted with, and `nginx -s reload` re-reads the
      # same stale inode. `deploy.sh`'s sync_proxy_config compares the
      # container's copy to this one and recreates the proxy when they differ;
      # don't remove that step, and don't assume a pull is enough. (certs below
      # is a DIRECTORY mount and has no such problem.)
      - ./proxy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - web
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Durable Celery BROKER (Phase 4). noeviction so a burst of large cached
  # values can never evict queued render-job messages (the failure the old
  # shared allkeys-lru instance risked); appendonly so in-flight jobs survive
  # a restart. Hostname stays `redis` — REDIS_URL is unchanged, so no consumer
  # or stale prod .env breaks.
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - web
    deploy:
      resources:
        reservations:
          memory: 128M
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Disposable Django CACHE (Phase 4). allkeys-lru + a hard cap — evicting a
  # cached layout list is fine; it can never touch the broker now that they
  # are separate instances. No volume: cache is rebuildable.
  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - web
    deploy:
      resources:
        reservations:
          memory: 64M
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    # Postgres tuning chosen for the 256 MB reservation. Raise shared_buffers
    # to ~25% of dedicated RAM and effective_cache_size to ~75% if you bump
    # the reservation. work_mem was 4 MB by default — too small for any
    # JOIN/sort heavier than a smoke test. log_min_duration_statement=1000
    # gives slow-query observability for free; logs go to docker compose logs.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
    ports:
      # Loopback-only (Phase 4): Docker port publishing bypasses host
      # firewalls, so 0.0.0.0 would expose Postgres to the internet on prod.
      # Host tooling (local dev, deploy checks) connects via localhost.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_MAX_CONNECTIONS=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web
    deploy:
      resources:
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/django/Dockerfile
    ports:
      # Loopback-only (Phase 4): raw Django must not be internet-reachable —
      # all traffic goes through nginx (TLS + routing + rate limits). deploy.sh
      # health checks and benchmark.sh hit localhost from the host.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - STORAGE_ROOT=/app/storage
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    # Routing for /api/* and /django-admin/* is defined in
    # proxy/nginx/nginx.conf. Container-level labels are no longer needed.
    networks:
      - web
    deploy:
      resources:
        # Gunicorn (2*nproc+1) workers × 4 threads + persistent DB connections;
        # bound at 2 GB so a leak in one worker can't OOM the whole container.
        # Reservation lets the orchestrator schedule with comfortable headroom.
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/nextjs/Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-875434468582-2a7h0gahc6sq6jm3gfmre9cca1lhh0p7.apps.googleusercontent.com}
    ports:
      # Loopback-only (Phase 4) — smoke tests + deploy.sh curl localhost:5004.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5004}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=/api
      - INTERNAL_API_URL=http://backend:8000/api
      - NODE_ENV=${NODE_ENV:-production}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      # Fail-fast (Phase 4): no baked default — a missing secret aborts the
      # deploy loudly instead of shipping a forgeable session-signing key.
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set in .env (>=32 chars)}
      - NEXTAUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set in .env (>=32 chars)}
    depends_on:
      backend:
        condition: service_healthy
    # Routing for /, /api/auth/*, /api/internal/proxy/* and /api/embed/proxy/*
    # is defined in proxy/nginx/nginx.conf. Container-level labels are no
    # longer needed.
    networks:
      - web
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # 127.0.0.1 (not localhost) — alpine wget resolves localhost to ::1
      # but the standalone Next.js server binds to 0.0.0.0 (IPv4 only).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Render worker — the only Celery worker ───────────────────────────────────
  # There used to be a second worker bound to a 'priority' queue for the
  # soft-proof / CMYK express path. That pipeline was retired in v1.8 and
  # NOTHING has routed to 'priority' since: all three entries in
  # product_editor/celery.py task_routes point at 'standard', and both dispatch
  # sites (api/views.py GenerateLayoutView + EditorRenderView) hardcode
  # queue_name = 'standard'. The container had therefore never run a single
  # task while holding a full Django + Pillow + MediaPipe process resident —
  # removed rather than left to look like capacity it never provided.
  #
  # This worker consumes BOTH queues on purpose. celery.py still invites
  # callers to opt in via apply_async(queue='priority'); with no consumer on
  # that queue such a task would wait in Redis forever and the customer's
  # render would vanish with no error. Draining both costs nothing and closes
  # that trap. (Ordering is not a priority guarantee — Celery round-robins
  # across -Q queues. It is a safety net, not a QoS tier.)
  #
  # Scale horizontally under load:
  #   docker compose up --scale celery-worker-standard=4
  # Concurrency: auto-detected from CPU count per replica — 2 render slots on
  # the 2-core prod box. Set CELERY_CONCURRENCY in .env to cap it.
  # Memory: 2 GB per replica — safe for large multi-image Pillow compositing.
  celery-worker-standard:
    build:
      context: .
      dockerfile: backend/django/Dockerfile
    command: celery-worker
    env_file:
      - .env
    environment:
      - STORAGE_ROOT=/app/storage
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      # Both queues — see the safety-net note above. Matches entrypoint.sh's
      # own default, so a worker started without CELERY_QUEUE behaves the same.
      - CELERY_QUEUE=priority,standard
      # CELERY_CONCURRENCY is intentionally NOT set here — Celery auto-detects
      # based on the number of CPUs available to the container, so the worker
      # scales with whatever the host has. Override in .env to cap it.
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    logging: *default-logging
    # Ping the worker THROUGH the broker (Phase 4): also fails when the broker
    # connection is wedged. Visibility only — plain compose does not auto-heal
    # unhealthy containers; `docker compose ps` shows the state and deploy can
    # gate on it. `$$` escapes the compose variable expansion of $(hostname).
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/celery -A product_editor inspect ping -d celery@$$(hostname) --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  celery-beat:
    build:
      context: .
      dockerfile: backend/django/Dockerfile
    command: celery-beat
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped
    logging: *default-logging

networks:
  web:

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

