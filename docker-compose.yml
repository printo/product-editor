# Default logging for every service — caps each container's JSON log file
# at 50 MB and keeps 3 rotations (~150 MB ceiling per service). Without
# this Docker's json-file driver writes to /var/lib/docker/containers/<id>/*-json.log
# without bound, so a noisy week of traffic can fill the disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ── Edge proxy: nginx ────────────────────────────────────────────────────
  # Sits behind Cloudflare. TLS terminates here using a Cloudflare Origin
  # Certificate (preferred — pair with CF "Full (strict)") or the self-signed
  # cert generated by deploy.sh as a bootstrap (works with CF "Full" only).
  # Routing rules + tunables live in proxy/nginx/nginx.conf — single source.
  # See proxy/nginx/README.md for cert workflow + troubleshooting.
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/nginx/certs:/etc/nginx/certs:ro
      - ./proxy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - web
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Durable Celery BROKER (Phase 4). noeviction so a burst of large cached
  # values can never evict queued render-job messages (the failure the old
  # shared allkeys-lru instance risked); appendonly so in-flight jobs survive
  # a restart. Hostname stays `redis` — REDIS_URL is unchanged, so no consumer
  # or stale prod .env breaks.
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - web
    deploy:
      resources:
        reservations:
          memory: 128M
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Disposable Django CACHE (Phase 4). allkeys-lru + a hard cap — evicting a
  # cached layout list is fine; it can never touch the broker now that they
  # are separate instances. No volume: cache is rebuildable.
  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - web
    deploy:
      resources:
        reservations:
          memory: 64M
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    # Postgres tuning chosen for the 256 MB reservation. Raise shared_buffers
    # to ~25% of dedicated RAM and effective_cache_size to ~75% if you bump
    # the reservation. work_mem was 4 MB by default — too small for any
    # JOIN/sort heavier than a smoke test. log_min_duration_statement=1000
    # gives slow-query observability for free; logs go to docker compose logs.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
    ports:
      # Loopback-only (Phase 4): Docker port publishing bypasses host
      # firewalls, so 0.0.0.0 would expose Postgres to the internet on prod.
      # Host tooling (local dev, deploy checks) connects via localhost.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_MAX_CONNECTIONS=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web
    deploy:
      resources:
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/django/Dockerfile
    ports:
      # Loopback-only (Phase 4): raw Django must not be internet-reachable —
      # all traffic goes through nginx (TLS + routing + rate limits). deploy.sh
      # health checks and benchmark.sh hit localhost from the host.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - STORAGE_ROOT=/app/storage
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    # Routing for /api/* and /admin/django-admin/* is defined in
    # proxy/nginx/nginx.conf. Container-level labels are no longer needed.
    networks:
      - web
    deploy:
      resources:
        # Gunicorn (2*nproc+1) workers × 4 threads + persistent DB connections;
        # bound at 2 GB so a leak in one worker can't OOM the whole container.
        # Reservation lets the orchestrator schedule with comfortable headroom.
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/nextjs/Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-875434468582-2a7h0gahc6sq6jm3gfmre9cca1lhh0p7.apps.googleusercontent.com}
    ports:
      # Loopback-only (Phase 4) — smoke tests + deploy.sh curl localhost:5004.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5004}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_BASE_URL=/api
      - INTERNAL_API_URL=http://backend:8000/api
      - NODE_ENV=${NODE_ENV:-production}
      - AUTH_TRUST_HOST=true
      # Fail-fast (Phase 4): no baked default — a missing secret aborts the
      # deploy loudly instead of shipping a forgeable session-signing key.
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set in .env (>=32 chars)}
      - NEXTAUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set in .env (>=32 chars)}
    depends_on:
      backend:
        condition: service_healthy
    # Routing for /, /api/auth/*, /api/internal/proxy/* and /api/embed/proxy/*
    # is defined in proxy/nginx/nginx.conf. Container-level labels are no
    # longer needed.
    networks:
      - web
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # 127.0.0.1 (not localhost) — alpine wget resolves localhost to ::1
      # but the standalone Next.js server binds to 0.0.0.0 (IPv4 only).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Priority worker — soft-proof / express / store-pickup orders ─────────────
  # Listens ONLY to the 'priority' queue so standard-queue backlog never delays
  # time-sensitive renders.
  # Concurrency: auto-detected from CPU count (no CELERY_CONCURRENCY override).
  # Set CELERY_CONCURRENCY in .env if you need to cap it on a shared server.
  # Memory: 2 GB limit — Pillow CMYK soft-proof peak is ~400-600 MB per task;
  # this gives headroom for the auto-detected concurrency level.
  celery-worker-priority:
    build:
      context: .
      dockerfile: backend/django/Dockerfile
    command: celery-worker
    env_file:
      - .env
    environment:
      - STORAGE_ROOT=/app/storage
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - CELERY_QUEUE=priority
      # CELERY_CONCURRENCY is intentionally NOT set here — Celery auto-detects
      # based on the number of CPUs available to the container.
      # Override in .env (e.g. CELERY_CONCURRENCY=4) if needed.
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    logging: *default-logging
    # Ping the worker THROUGH the broker (Phase 4): also fails when the broker
    # connection is wedged. Visibility only — plain compose does not auto-heal
    # unhealthy containers; `docker compose ps` shows the state and deploy can
    # gate on it. `$$` escapes the compose variable expansion of $(hostname).
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/celery -A product_editor inspect ping -d celery@$$(hostname) --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  # ── Standard worker ────────— PNG/TIFF exports for regular delivery orders ────────
  # Scale horizontally under load:
  #   docker compose up --scale celery-worker-standard=4
  # Concurrency: auto-detected from CPU count per replica.
  # Memory: 2 GB per replica — safe for large multi-image Pillow compositing.
  celery-worker-standard:
    build:
      context: .
      dockerfile: backend/django/Dockerfile
    command: celery-worker
    env_file:
      - .env
    environment:
      - STORAGE_ROOT=/app/storage
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - CELERY_QUEUE=standard
      # CELERY_CONCURRENCY is intentionally NOT set here — Celery auto-detects
      # based on the number of CPUs available to the container.
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    logging: *default-logging
    # Ping the worker THROUGH the broker (Phase 4) — see celery-worker-priority.
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/celery -A product_editor inspect ping -d celery@$$(hostname) --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  celery-beat:
    build:
      context: .
      dockerfile: backend/django/Dockerfile
    command: celery-beat
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped
    logging: *default-logging

  # ── Observability Stack (Loki + Promtail + Grafana) ────────────────────────
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yml
    # A freshly created named volume is root-owned; the image's default
    # non-root user (10001) can't mkdir under it -- confirmed by hand, Loki
    # crash-loops on first boot with "mkdir /tmp/loki/rules: permission
    # denied" otherwise. Loki has no network exposure (see above), so running
    # it as root trades nothing meaningful away here.
    user: "0:0"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki
    networks:
      - web
    # No published port — only promtail (writes) and grafana (reads) talk to
    # Loki, both over the internal "web" network. Nothing external needs it.
    deploy:
      resources:
        limits:
          memory: 250M
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana-oss:latest
    # No published port — reached only via the proxy's /grafana/ location
    # (nginx.conf), same pattern backend/frontend already use. Access control
    # is Grafana's own login, not network position.
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Reverse-proxied under /grafana/ on the same public domain as
      # everything else — see nginx.conf's ^~ /grafana/ location.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://localhost/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Printo Google login (same @printo.in domain gate as the app's own
      # sign-in) — off until GF_AUTH_GOOGLE_CLIENT_ID/SECRET are set in .env,
      # so a half-configured OAuth setup can't lock everyone out. The admin
      # account above stays as a break-glass fallback either way.
      - GF_AUTH_GOOGLE_ENABLED=${GF_AUTH_GOOGLE_ENABLED:-false}
      - GF_AUTH_GOOGLE_CLIENT_ID=${GF_AUTH_GOOGLE_CLIENT_ID:-}
      - GF_AUTH_GOOGLE_CLIENT_SECRET=${GF_AUTH_GOOGLE_CLIENT_SECRET:-}
      - GF_AUTH_GOOGLE_ALLOWED_DOMAINS=printo.in
      - GF_AUTH_GOOGLE_ALLOW_SIGN_UP=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - monitoring

networks:
  web:

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  loki_data:
  grafana_data:

