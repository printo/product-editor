server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'service_name'
    pipeline_stages:
      # Promtail's docker_sd_configs target already unwraps Docker's own
      # {"log":...,"stream":...,"time":...} envelope before pipeline_stages
      # ever sees a line -- an extra json stage expecting that envelope here
      # parses the wrong thing and silently extracts nothing (confirmed by
      # running this: with it, no line ever produced a "status" label).
      # This parses nginx's own json_analytics line directly.
      - json:
          expressions:
            remote_addr: remote_addr
            time_local: time_local
            request_method: request_method
            request_uri: request_uri
            status: status
            body_bytes_sent: body_bytes_sent
            request_time: request_time
            upstream_response_time: upstream_response_time
      - labels:
          status: status
          request_method: request_method
