# nginx.conf — product-editor edge proxy
#
# Replaces the previous Traefik setup. Sits behind Cloudflare and terminates
# TLS at the origin so CF can be configured for "Full (strict)".
#
# TLS strategy:
#   • Origin cert lives at /etc/nginx/certs/origin.crt + origin.key
#   • Production: paste a Cloudflare Origin Certificate (15-year, free, issued
#     from CF dashboard → SSL/TLS → Origin Server → Create Certificate). CF
#     trusts it automatically; browsers do not (they only see CF's edge cert).
#   • Bootstrap / dev: deploy.sh generates a self-signed cert with the same
#     filenames if none exist. Set CF SSL/TLS mode to "Full" (not strict)
#     until the real origin cert is pasted in.
#
# Routing precedence — matches the Traefik priorities we replaced:
#   priority 3 → ^~ /api/auth/            → frontend (NextAuth)
#   priority 3 → ^~ /api/internal/proxy/  → frontend (dashboard proxy)
#   priority 3 → ^~ /api/embed/proxy/     → frontend (embed-token proxy)
#   priority 2 → ^~ /django-admin/        → backend (PIA/Google SSO gate, superuser only — see auth_request below)
#   priority 2 → ^~ /grafana/             → grafana (own login-gated, --profile monitoring only)
#   priority 2 → ^~ /faro/                → alloy (public RUM receiver, --profile monitoring only)
#   priority 2 → ^~ /api/                 → backend (everything else)
#   priority 1 → /                        → frontend (catch-all)

worker_processes auto;
worker_rlimit_nofile 8192;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  # ── MIME / basics ────────────────────────────────────────────────────────
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  server_tokens off;
  keepalive_timeout 65;

  # ── Logging ──────────────────────────────────────────────────────────────
  log_format upstream_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct=$upstream_connect_time '
                          'uht=$upstream_header_time urt=$upstream_response_time';
  log_format json_analytics escape=json
    '{"remote_addr":"$remote_addr",'
    '"time_local":"$time_local",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"}';

  access_log /var/log/nginx/access.log upstream_log;
  # To stdout, not a file: Promtail only scrapes each container's Docker-
  # captured stdout (docker_sd_configs + the docker socket) — it never reads
  # files inside another container's volume. A file here would just
  # accumulate on disk, ungoverned by any rotation, and never reach Loki.
  access_log /dev/stdout json_analytics;
  error_log  /var/log/nginx/error.log  warn;

  # ── Gzip (defence-in-depth on top of Django's GZipMiddleware) ────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vnd.rim.location.xloc
    text/vtt
    text/x-component
    text/x-cross-domain-policy;

  # ── Body limits ──────────────────────────────────────────────────────────
  # Chunked uploads send 2 MB chunks but a single request can carry an entire
  # file up to MAX_UPLOAD_FILE_SIZE_MB (default 50 MB). 100 MB gives headroom
  # for chunk + JSON envelope without blocking legit traffic.
  client_max_body_size 100M;
  client_body_buffer_size 1M;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;

  # ── Proxy buffer sizing ──────────────────────────────────────────────────
  proxy_connect_timeout 30s;
  proxy_send_timeout    600s;   # sync render can run up to 600s
  proxy_read_timeout    600s;
  proxy_buffer_size     16k;
  proxy_buffers         8 16k;
  proxy_busy_buffers_size 32k;

  # ── Real client IP (Cloudflare → nginx) ──────────────────────────────────
  # Trust CF's Connecting-IP header so the in-process per-IP rate limiter in
  # the login server action sees real client addresses, not CF edge IPs.
  # CF IP ranges from https://www.cloudflare.com/ips-v4/ — refresh annually.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  # IPv6
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # ── Upstream resolution ──────────────────────────────────────────────────
  # We deliberately do NOT use `upstream { server ... }` blocks. nginx resolves
  # those hostnames at startup, which (a) breaks `nginx -t` validation when the
  # docker-compose network isn't running, and (b) crashes the proxy if the
  # backend container is restarted (cached IP becomes stale). Using a variable
  # in `proxy_pass` defers resolution to request time via the `resolver`
  # directive — Docker's embedded DNS at 127.0.0.11 is the source of truth.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # ── Common proxy headers (applied via map / repeated) ────────────────────
  # nginx doesn't have label-style middleware; the simplest pattern is to
  # repeat the proxy_set_header lines in each location. We bundle them via
  # an `include` snippet so any drift stays single-source.

  # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health probe (used by docker-compose healthcheck — must answer on HTTP
    # so the check doesn't follow a 301 to HTTPS and choke on the cert).
    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # ACME http-01 challenges (kept for parity — currently unused since we
    # use the Cloudflare Origin Certificate, not Let's Encrypt). Harmless.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── Main HTTPS server ────────────────────────────────────────────────────
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # Origin cert — see top-of-file note. Self-signed in bootstrap; replace
    # with a Cloudflare Origin Cert for "Full (strict)".
    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Common proxy headers (every location reuses these via include) ────
    # Defined inline as a snippet so we don't need a second mounted file.
    # `proxy_http_version 1.1` + empty Connection header keeps the keepalive
    # pool alive; `Host $host` preserves the original Host so Django's
    # ALLOWED_HOSTS check sees the real hostname.

    # ── Defence-in-depth security headers ─────────────────────────────────
    # Cloudflare adds HSTS via "Always Use HTTPS"; we duplicate at the origin
    # so direct-origin hits (CF bypass) still get the right headers. We do
    # NOT set X-Frame-Options here — the embed iframe pages need to be
    # embedded by printo.in, and CSP `frame-ancestors` (set by Next.js per-
    # route in next.config.mjs) is the modern, route-granular replacement.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Health probe (no auth, no upstream) ───────────────────────────────
    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # ── Django static files (admin CSS/JS, DRF browsable API, Scalar docs) ─
    # WhiteNoise serves these from the Django container in production. Without
    # this route, /static/admin/*, /static/rest_framework/*, /static/scalar/*
    # all fall through to the frontend catch-all and 404 — leaving Django
    # admin unstyled and the API docs broken. Note: Next.js bundles live at
    # /_next/static/* (not /static/*), so there's no collision.
    location ^~ /static/ {
      set $backend_upstream "backend:8000";
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
      # WhiteNoise sets long-lived Cache-Control on hashed assets; we just
      # pass through and let nginx itself cache nothing (browser handles it).
      proxy_buffering on;
    }

    # ── NextAuth (frontend) ───────────────────────────────────────────────
    location ^~ /api/auth/ {
      set $frontend_upstream "frontend:3000";
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
    }

    # ── Frontend internal proxy (dashboard / editor) ──────────────────────
    location ^~ /api/internal/proxy/ {
      set $frontend_upstream "frontend:3000";
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
      # Long timeouts because /api/jobs/<id>/download/ can stream a 200-canvas
      # ZIP through this proxy (proxied to Django).
      proxy_read_timeout 600s;
      proxy_buffering off;
    }

    # ── Frontend embed proxy (printo.in iframe) ───────────────────────────
    location ^~ /api/embed/proxy/ {
      set $frontend_upstream "frontend:3000";
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
      proxy_read_timeout 600s;
      proxy_buffering off;
    }

    # ── Django Admin (PIA/Google SSO gate, superuser only) ────────────────
    # nginx can't read the NextAuth session itself — it's a JWT signed with
    # AUTH_SECRET, which only the frontend holds. auth_request asks the
    # frontend "is this session a PIA superuser?" via an internal subrequest
    # (original cookies are forwarded automatically) before letting the real
    # request through. See:
    #   frontend/nextjs/src/app/api/internal/verify-django-admin/route.ts
    #   frontend/nextjs/src/app/django-admin-denied/page.tsx
    location ^~ /django-admin/ {
      auth_request /internal/verify-django-admin;
      error_page 403 = @django_admin_denied;

      # Lift the signed identity off the auth subrequest's 200 response and
      # hand it to Django, which logs the operator straight into the admin
      # instead of showing a second login form (product_editor/admin_sso.py).
      #
      # Every one of these is also proxy_set_header'd below, which REPLACES
      # whatever the client sent under the same name — so a browser cannot
      # supply its own X-PE-Admin-* and have Django see it. The values are
      # additionally HMAC-signed, because that replacement only protects the
      # path through nginx; see the route's "Identity handoff" note.
      auth_request_set $pe_admin_id    $upstream_http_x_pe_admin_id;
      auth_request_set $pe_admin_email $upstream_http_x_pe_admin_email;
      auth_request_set $pe_admin_exp   $upstream_http_x_pe_admin_exp;
      auth_request_set $pe_admin_sig   $upstream_http_x_pe_admin_sig;

      set $backend_upstream "backend:8000";
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
      proxy_set_header X-PE-Admin-Id     $pe_admin_id;
      proxy_set_header X-PE-Admin-Email  $pe_admin_email;
      proxy_set_header X-PE-Admin-Exp    $pe_admin_exp;
      proxy_set_header X-PE-Admin-Sig    $pe_admin_sig;
    }

    # Target of the auth_request above. `internal;` makes nginx 404 anything
    # that hits this path directly from outside — it only ever runs as a
    # subrequest. Rewritten to the real API path first because proxy_pass
    # uses a variable upstream (see "Upstream resolution" above): with a
    # variable, nginx forwards the current URI unchanged rather than
    # splicing in a literal path, same reason the /faro/ block below rewrites
    # instead of relying on proxy_pass's own prefix-stripping.
    # `set` MUST come before `rewrite ... break` — break stops ALL further
    # rewrite-module directives in this location, set included, so a `set`
    # written after it silently never runs (proved this the hard way: shipped
    # it backwards once, got "uninitialized \"frontend_upstream\" variable" /
    # "invalid URL prefix in \"http://\"" / 500s in production).
    location = /internal/verify-django-admin {
      internal;
      set $frontend_upstream "frontend:3000";
      rewrite ^ /api/internal/verify-django-admin break;
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length    "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Where a denied /django-admin/ request lands — a small Next.js page
    # with a 3-second countdown back to /. Same rewrite-then-bare-variable
    # reasoning as above, and same set-before-rewrite ordering requirement.
    location @django_admin_denied {
      set $frontend_upstream "frontend:3000";
      rewrite ^ /django-admin-denied break;
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
    }

    # ── API docs (Scalar UI, served by Django at /docs/api/) ──────────────
    location ^~ /docs/ {
      set $backend_upstream "backend:8000";
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
    }

    # ── Backend API (everything else under /api/) ─────────────────────────
    location ^~ /api/ {
      set $backend_upstream "backend:8000";
      proxy_pass http://$backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
      # Disable buffering so StreamingHttpResponse (RenderJobDownloadView ZIPs)
      # streams to the client without staging to disk.
      proxy_buffering off;
      proxy_read_timeout 600s;
    }

    # ── Grafana (observability dashboards; opt-in --profile monitoring) ───
    # No port is published for grafana or loki (docker-compose.yml) — this
    # location is the only way in. Access control is Grafana's own login
    # (Google OAuth restricted to printo.in, or the break-glass local admin
    # account), not network position.
    location ^~ /grafana/ {
      set $grafana_upstream "grafana:3000";
      # No trailing slash -- GF_SERVER_SERVE_FROM_SUB_PATH=true means Grafana
      # wants the /grafana prefix preserved, not stripped (confirmed by hand:
      # stripping it produced an infinite /grafana/ -> /grafana/ redirect).
      proxy_pass http://$grafana_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      # Grafana's live features need a real websocket upgrade, unlike the
      # other locations in this file.
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
    }

    # ── Faro RUM receiver (frontend web vitals / console errors) ─────────
    # Reachable from customer browsers, unlike grafana/loki above -- that's
    # the point, the Faro Web SDK POSTs here directly. No auth: Faro payloads
    # aren't request-authenticated by design, same as any other RUM
    # collector (Sentry's tunnel endpoint works the same way).
    location ^~ /faro/ {
      set $alloy_upstream "alloy:12347";
      # A trailing slash on proxy_pass only auto-strips the location prefix
      # when the upstream is a static host -- with a variable (required here,
      # see the "Upstream resolution" note above) nginx passes the original
      # URI through unchanged either way. Confirmed by hand: without this
      # rewrite, /faro/collect reached Alloy as literally /faro/collect,
      # which 404s -- Alloy's faro.receiver only answers at /collect.
      rewrite ^/faro/(.*)$ /$1 break;
      proxy_pass http://$alloy_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # ── Frontend (catch-all: /, /login, /editor/*, etc.) ──────────────────
    location / {
      set $frontend_upstream "frontend:3000";
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header Connection        "";
    }
  }
}
